<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#07060a" />
    <title>The Elevator Doesn't Stop</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16' shape-rendering='crispEdges'%3E%3Crect width='16' height='16' fill='%2307060a'/%3E%3Crect x='3' y='2' width='10' height='13' fill='%237a5c26'/%3E%3Crect x='4' y='3' width='4' height='12' fill='%23b08a3a'/%3E%3Crect x='8' y='3' width='4' height='12' fill='%23946f2e'/%3E%3Crect x='7' y='0' width='2' height='2' fill='%23ffb347'/%3E%3C/svg%3E" />
    <style>
      html, body {
        margin: 0;
        height: 100%;
        background: #07060a;
        overflow: hidden;
        touch-action: none;
        -webkit-user-select: none;
        user-select: none;
        -webkit-tap-highlight-color: transparent;
      }
      #stage {
        position: fixed;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      canvas#screen {
        image-rendering: pixelated;
        image-rendering: crisp-edges;
        display: block;
        cursor: default;
        outline: none;
      }
      #crt {
        position: fixed;
        pointer-events: none;
        background: repeating-linear-gradient(to bottom, rgba(0, 0, 0, 0) 0, rgba(0, 0, 0, 0) 2px, rgba(0, 0, 0, 0.22) 3px, rgba(0, 0, 0, 0) 4px);
        mix-blend-mode: multiply;
        display: none;
      }
      #crt.on { display: block; }
      #rotate {
        display: none;
        position: fixed;
        inset: auto 0 12px 0;
        text-align: center;
        font: 13px/1.4 monospace;
        color: #8f8264;
        pointer-events: none;
      }
      @media (orientation: portrait) and (pointer: coarse) {
        #rotate { display: block; }
      }
      #name-input {
        position: fixed;
        left: -1000px;
        top: 0;
        opacity: 0;
        width: 10px;
        font-size: 16px;
      }
    </style>
  </head>
  <body>
    <div id="stage"><canvas id="screen" width="384" height="216" tabindex="0"></canvas></div>
    <div id="crt"></div>
    <div id="rotate">Turn your phone sideways for a bigger panel.</div>
    <input id="name-input" type="text" maxlength="12" autocomplete="off" autocapitalize="words" spellcheck="false" />
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
