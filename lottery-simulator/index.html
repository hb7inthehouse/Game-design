<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>Lottery Simulator</title>
<style>
  :root {
    --bg: #111318;
    --panel: #1b1e26;
    --text: #f2f2f2;
    --muted: #9aa0ab;
    --fail: #ff1a1a;
    --win: #ffd23f;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    display: flex;
    flex-direction: column;
    user-select: none;
    -webkit-user-select: none;
    -webkit-tap-highlight-color: transparent;
    cursor: pointer;
    overflow: hidden;
  }
  header {
    text-align: center;
    padding: 20px 16px 8px;
  }
  h1 {
    margin: 0;
    font-size: clamp(2rem, 7vw, 3.5rem);
    letter-spacing: 0.02em;
  }
  .odds {
    margin-top: 6px;
    color: var(--muted);
    font-size: 1rem;
  }
  main {
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 16px;
    min-height: 0;
  }
  #result {
    text-align: center;
  }
  #prompt {
    color: var(--muted);
    font-size: clamp(1.2rem, 4vw, 1.8rem);
  }
  #fail {
    display: none;
    color: var(--fail);
    font-weight: 900;
    font-size: clamp(5rem, 28vw, 16rem);
    line-height: 1;
    letter-spacing: 0.04em;
    text-shadow: 0 0 24px rgba(255, 26, 26, 0.55);
  }
  #fail.pop { animation: pop 0.18s ease-out; }
  @keyframes pop {
    from { transform: scale(0.85); opacity: 0.4; }
    to   { transform: scale(1);    opacity: 1; }
  }
  #win { display: none; }
  #win svg { width: min(70vw, 50vh); height: auto; }
  #win p {
    color: var(--win);
    font-size: clamp(1.6rem, 6vw, 3rem);
    font-weight: 800;
    margin: 12px 0 0;
  }
  footer {
    display: flex;
    justify-content: center;
    gap: 24px;
    flex-wrap: wrap;
    padding: 12px 16px 20px;
    color: var(--muted);
    font-size: 0.95rem;
  }
  footer b { color: var(--text); }
</style>
</head>
<body>
  <header>
    <h1>Lottery Simulator</h1>
    <div class="odds">Odds of a happy monkey: 1 in 292,201,338</div>
  </header>

  <main>
    <div id="result">
      <div id="prompt">Click anywhere to play</div>
      <div id="fail">FAIL</div>
      <div id="win">
        <!-- Happy monkey -->
        <svg viewBox="0 0 200 200" role="img" aria-label="A happy monkey">
          <!-- ears -->
          <circle cx="38" cy="98" r="26" fill="#7a4a24"/>
          <circle cx="162" cy="98" r="26" fill="#7a4a24"/>
          <circle cx="38" cy="98" r="15" fill="#f1c79b"/>
          <circle cx="162" cy="98" r="15" fill="#f1c79b"/>
          <!-- head -->
          <circle cx="100" cy="100" r="68" fill="#8b5a2b"/>
          <!-- face -->
          <path d="M100 62 C 70 50, 46 72, 52 100 C 44 130, 66 160, 100 160 C 134 160, 156 130, 148 100 C 154 72, 130 50, 100 62 Z" fill="#f1c79b"/>
          <!-- happy closed eyes -->
          <path d="M70 92 Q 80 80 90 92" stroke="#2b1a0e" stroke-width="5" fill="none" stroke-linecap="round"/>
          <path d="M110 92 Q 120 80 130 92" stroke="#2b1a0e" stroke-width="5" fill="none" stroke-linecap="round"/>
          <!-- cheeks -->
          <circle cx="66" cy="112" r="9" fill="#f59a8b" opacity="0.7"/>
          <circle cx="134" cy="112" r="9" fill="#f59a8b" opacity="0.7"/>
          <!-- nose -->
          <ellipse cx="94" cy="108" rx="3.5" ry="2.5" fill="#2b1a0e"/>
          <ellipse cx="106" cy="108" rx="3.5" ry="2.5" fill="#2b1a0e"/>
          <!-- big smile -->
          <path d="M72 122 Q 100 156 128 122 Z" fill="#5a1f1f" stroke="#2b1a0e" stroke-width="4" stroke-linejoin="round"/>
          <path d="M86 138 Q 100 148 114 138 Q 100 132 86 138 Z" fill="#ff7a7a"/>
          <!-- hair tuft -->
          <path d="M92 34 Q 96 20 104 30 Q 110 18 112 36" stroke="#7a4a24" stroke-width="5" fill="none" stroke-linecap="round"/>
        </svg>
        <p>JACKPOT! You won the lottery!</p>
      </div>
    </div>
  </main>

  <footer>
    <span>Tries: <b id="tries">0</b></span>
    <span>Wins: <b id="wins">0</b></span>
  </footer>

<script>
  const ODDS = 292201338;

  // Unbiased random integer in [0, ODDS) using the browser's crypto RNG.
  // Rejection sampling avoids the slight bias of a plain modulo.
  const LIMIT = Math.floor(2 ** 32 / ODDS) * ODDS;
  const buf = new Uint32Array(1);
  function roll() {
    let n;
    do {
      crypto.getRandomValues(buf);
      n = buf[0];
    } while (n >= LIMIT);
    return n % ODDS;
  }

  const prompt = document.getElementById('prompt');
  const fail = document.getElementById('fail');
  const win = document.getElementById('win');
  const triesEl = document.getElementById('tries');
  const winsEl = document.getElementById('wins');
  let tries = 0, wins = 0;

  function play() {
    tries++;
    triesEl.textContent = tries.toLocaleString();
    prompt.style.display = 'none';

    if (roll() === 0) {           // exactly 1 chance in 292,201,338
      wins++;
      winsEl.textContent = wins.toLocaleString();
      fail.style.display = 'none';
      win.style.display = 'block';
    } else {
      win.style.display = 'none';
      fail.style.display = 'block';
      fail.classList.remove('pop');
      void fail.offsetWidth;        // restart the pop animation
      fail.classList.add('pop');
    }
  }

  document.addEventListener('pointerdown', play);
</script>
</body>
</html>
