<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Lottery Simulator</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap">
<style>
  /* Layout: first-person seat at a 16-bit slot machine. Casino fills the back; stats on the left, collection on the right (stacked below on phones). */
  :root {
    color-scheme: dark;
    --night: #141433;
    --plum: #2a1a4a;
    --panel: rgba(20, 16, 44, 0.86);
    --gold: #ffcf33;
    --gold-dark: #9a6a00;
    --cream: #fff2d0;
    --muted: #c9b8e8;
    --fail: #ff2424;
    --led: #5dff6a;
    --pink: #ff4fa8;
    --cyan: #3fe0ff;
    --common: #c8d0e0;
    --uncommon: #4fa3ff;
    --rare: #ffcf33;
    --pixel: "Press Start 2P", "Courier New", monospace;
    --term: "VT323", "Courier New", monospace;
  }
  * { box-sizing: border-box; }
  html { background: var(--night); }
  body {
    margin: 0;
    min-height: 100vh;
    color: var(--cream);
    font-family: var(--term);
    font-size: 20px;
    background: var(--night) url("assets/bg.webp") center / cover no-repeat fixed;
    -webkit-tap-highlight-color: transparent;
    user-select: none;
    -webkit-user-select: none;
  }
  body::after {
    /* darken the casino a touch so the machine pops */
    content: "";
    position: fixed;
    inset: 0;
    background: radial-gradient(ellipse at 50% 55%, transparent 30%, rgba(10, 6, 30, 0.55) 100%);
    pointer-events: none;
    z-index: 0;
  }
  img { image-rendering: auto; }
  .wrap {
    position: relative;
    z-index: 1;
    max-width: 1400px;
    margin: 0 auto;
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
    padding-block: 10px 24px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 6px;
  }
  header { width: 100%; display: flex; justify-content: center; }
  header h1 { margin: 0; line-height: 0; }
  .title { display: block; width: min(92vw, 420px); height: auto; filter: drop-shadow(0 6px 10px rgba(0,0,0,0.5)); }

  /* Music / sound buttons */
  .audio {
    position: fixed;
    top: calc(10px + env(safe-area-inset-top, 0px));
    right: max(12px, env(safe-area-inset-right, 0px));
    z-index: 25;
    display: flex;
    gap: 6px;
  }
  .sbtn {
    width: 54px;
    padding: 0;
    border: 0;
    background: none;
    cursor: pointer;
    line-height: 0;
  }
  .sbtn img { width: 100%; height: auto; display: none; }
  .sbtn[aria-pressed="true"] .up { display: block; }
  .sbtn[aria-pressed="true"]:active .up { display: none; }
  .sbtn[aria-pressed="true"]:active .down { display: block; }
  .sbtn[aria-pressed="false"] .off { display: block; }
  .sbtn:focus-visible, .dbtn:focus-visible, #again:focus-visible { outline: 3px solid var(--gold); outline-offset: 2px; border-radius: 8px; }

  /* Three-column table: stats | machine | collection */
  .table {
    width: 100%;
    display: grid;
    grid-template-columns: minmax(0, 1fr) auto minmax(0, 1fr);
    align-items: center;
    gap: 20px;
  }
  .side { display: flex; flex-direction: column; gap: 10px; min-width: 0; }
  .side.left { align-items: flex-end; }
  .side.right { align-items: flex-start; }
  .panel {
    width: 100%;
    max-width: 330px;
    background: var(--panel);
    border: 3px solid var(--gold-dark);
    box-shadow: inset 0 0 0 2px #000, 0 8px 20px rgba(0,0,0,0.5);
    border-radius: 10px;
    padding: 12px;
  }
  .panel h2 {
    margin: 0 0 10px;
    font-family: var(--pixel);
    font-weight: 400;
    font-size: 12px;
    color: var(--gold);
    letter-spacing: 0.05em;
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    gap: 8px;
    flex-wrap: wrap;
  }
  .panel h2 span { font-family: var(--term); font-size: 18px; color: var(--muted); letter-spacing: 0; }

  /* ---------- The slot machine ---------- */
  .machine {
    position: relative;
    width: clamp(280px, calc((100vh - 150px) * 0.75), min(560px, 40vw));
    aspect-ratio: 1086 / 1448;
    container-type: inline-size;
    cursor: pointer;
    filter: drop-shadow(0 16px 24px rgba(0, 0, 0, 0.6));
  }
  .machine > * { position: absolute; }
  .mbody { inset: 0; width: 100%; height: 100%; z-index: 2; pointer-events: none; }

  /* Screen sits behind the cabinet and shows through the window */
  #screen {
    left: 19.2%; top: 29.3%; width: 61.2%; height: 24.6%;
    z-index: 1;
    overflow: hidden;
    background:
      repeating-linear-gradient(0deg, rgba(0,0,0,0.22) 0 2px, transparent 2px 4px),
      radial-gradient(ellipse at 50% 45%, #2b2260 0%, #120c2e 75%);
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
  }
  #screen.rare { box-shadow: inset 0 0 6cqw rgba(255, 207, 51, 0.6); }
  #screen > [hidden] { display: none !important; }

  #prompt { font-family: var(--pixel); color: var(--gold); font-size: 3.4cqw; line-height: 1.6; animation: blink 1.1s steps(2) infinite; }
  #prompt small { display: block; font-size: 2.3cqw; color: var(--muted); }
  @keyframes blink { 50% { opacity: 0.35; } }

  #drawing { display: flex; flex-direction: column; align-items: center; gap: 1.6cqw; }
  .ball {
    width: 15cqw; aspect-ratio: 1; border-radius: 50%;
    display: grid; place-items: center;
    background: radial-gradient(circle at 35% 30%, #fff 0 8%, #ffe680 20%, var(--gold) 50%, #a87400 100%);
    border: 0.5cqw solid #3a2400;
    color: #2a1d00;
    font-family: var(--pixel);
    font-size: 2.2cqw;
    overflow: hidden; word-break: break-all; padding: 1cqw; line-height: 1.1;
    animation: shake 0.22s steps(2) infinite;
  }
  @keyframes shake {
    0% { transform: translate(0, 0) rotate(0); }
    25% { transform: translate(-0.5cqw, 0.3cqw) rotate(-8deg); }
    50% { transform: translate(0.4cqw, -0.3cqw) rotate(6deg); }
    75% { transform: translate(-0.3cqw, -0.4cqw) rotate(-4deg); }
  }
  .drawlabel { font-family: var(--pixel); font-size: 2.4cqw; color: var(--muted); }

  #fail { width: 82%; height: auto; animation: slam 0.3s steps(6) both; }
  @keyframes slam {
    0% { transform: scale(2); opacity: 0; }
    50% { transform: scale(0.9, 0.75); opacity: 1; }
    75% { transform: scale(0.97, 1.08); }
    100% { transform: scale(1); }
  }

  #win { width: 100%; height: 100%; display: grid; grid-template-columns: auto minmax(0, 1fr); align-items: center; gap: 2cqw; padding: 1.4cqw 2.4cqw; }
  #winImg { height: 21cqw; width: auto; max-width: 100%; animation: pop 0.8s cubic-bezier(.2,1.6,.4,1) both, bob 1.4s ease-in-out 0.8s infinite; }
  @keyframes pop { 0% { transform: translateY(100%) scale(0.6); } 60% { transform: translateY(-8%) scale(1.06); } 100% { transform: none; } }
  @keyframes bob { 0%, 100% { transform: rotate(0); } 25% { transform: rotate(-4deg); } 75% { transform: rotate(4deg); } }
  .wininfo { display: flex; flex-direction: column; align-items: center; gap: 1cqw; min-width: 0; }
  #winText { width: 100%; height: auto; animation: slam 0.35s steps(6) 0.2s both; }
  .badge { font-family: var(--pixel); font-size: 1.7cqw; padding: 0.6cqw 1.2cqw; border-radius: 0.6cqw; background: var(--rc, var(--common)); color: #120c2e; }
  #winName { font-family: var(--pixel); font-size: 2.3cqw; color: var(--cream); line-height: 1.3; }

  /* Marquee readout, LED money, buttons, lever, tray */
  .marquee {
    left: 22%; top: 13.6%; width: 56%; height: 7.4%;
    z-index: 3;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    font-family: var(--pixel); color: var(--gold); text-shadow: 0 0.4cqw 0 #6b1200;
    pointer-events: none; line-height: 1.5; text-align: center;
  }
  .marquee b { font-weight: 400; font-size: 3.6cqw; }
  .marquee span { font-size: 2cqw; color: var(--cream); }
  #money {
    left: 64.8%; top: 58.7%; width: 19.4%; height: 3.8%;
    z-index: 3;
    display: flex; align-items: center; justify-content: center;
    font-family: var(--term); font-size: 6.2cqw; line-height: 1;
    color: var(--led); text-shadow: 0 0 1.4cqw rgba(93, 255, 106, 0.9);
    pointer-events: none; white-space: nowrap; overflow: hidden;
  }
  #money.bump { animation: bump 0.6s steps(4); }
  @keyframes bump { 0% { color: #fff; transform: scale(1.3); } 100% { transform: scale(1); } }
  .dbtn {
    z-index: 3;
    width: 11.4%;
    top: 61.6%;
    padding: 0; border: 0; background: none; cursor: pointer; line-height: 0;
  }
  .dbtn img { width: 100%; height: auto; display: none; }
  .dbtn[aria-pressed="false"] .up, .dbtn[aria-pressed="true"] .on { display: block; }
  .dbtn:not(:disabled):hover .up { filter: brightness(1.15); }
  .dbtn:disabled { cursor: default; }
  .dbtn[data-mode="easy"] { left: 15.0%; }
  .dbtn[data-mode="normal"] { left: 26.1%; }
  .dbtn[data-mode="hard"] { left: 37.5%; }
  .dbtn[data-mode="real"] { left: 49.3%; }
  .slot-hint {
    left: 66.8%; top: 64.4%; width: 17.4%; height: 4.6%;
    z-index: 3; pointer-events: none;
    display: flex; align-items: center; justify-content: center;
    font-family: var(--pixel); font-size: 1.5cqw; color: #2a1a4a;
  }
  #lever {
    left: 89.87%; top: 27.07%; width: 10.13%; height: auto;
    z-index: 3;
    transform-origin: 50% 100%;
    pointer-events: none;
  }
  #lever.pull { animation: pull 0.7s steps(10) both; }
  @keyframes pull {
    0% { transform: scaleY(1); }
    35%, 55% { transform: scaleY(-0.62); }
    85% { transform: scaleY(1.06); }
    100% { transform: scaleY(1); }
  }
  #payout {
    left: 20%; top: 85.5%; width: 60%; height: 11%;
    z-index: 3; pointer-events: none;
    display: flex; align-items: center; justify-content: center;
    font-family: var(--pixel); font-size: 4.6cqw; color: var(--gold);
    text-shadow: 0 0.5cqw 0 #6b1200, 0 0 2cqw rgba(255, 207, 51, 0.8);
    opacity: 0;
  }
  #payout.show { animation: payout 2.4s ease-out both; }
  @keyframes payout {
    0% { opacity: 0; transform: translateY(40%) scale(0.6); }
    15% { opacity: 1; transform: translateY(0) scale(1.15); }
    25% { transform: scale(1); }
    80% { opacity: 1; }
    100% { opacity: 0; transform: translateY(-60%); }
  }

  /* ---------- Stats (brass plaques) ---------- */
  .plaques { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
  .plaque {
    aspect-ratio: 300 / 90;
    background: url("assets/plaque.webp") center / 100% 100% no-repeat;
    display: flex; justify-content: space-between; align-items: center; gap: 6px;
    padding: 0 12%;
    line-height: 1;
    min-width: 0;
  }
  .plaque span { font-size: 17px; color: var(--muted); white-space: nowrap; }
  .plaque b { font-weight: 400; font-size: 24px; color: var(--cream); font-variant-numeric: tabular-nums; overflow: hidden; text-overflow: ellipsis; }
  .plate {
    margin-top: 8px;
    min-height: 44px;
    background: url("assets/plate.webp") center / 100% 100% no-repeat;
    display: flex; align-items: center; justify-content: center; text-align: center;
    padding: 6px 7%;
    font-size: 18px; line-height: 1; white-space: nowrap; overflow: hidden;
    color: var(--cream);
  }
  .plate.lucky { color: var(--led); }
  .plate.unlucky { color: #ff8a7a; }

  /* ---------- Collection (card frames) ---------- */
  .cards { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px 10px; }
  .card { display: flex; flex-direction: column; align-items: center; gap: 2px; min-width: 0; }
  .frame { position: relative; width: 100%; line-height: 0; }
  .frame .art { position: absolute; object-fit: cover; }
  .frame .border { position: relative; width: 100%; height: auto; }
  .frame .nm {
    position: absolute; left: 12%; width: 76%;
    display: flex; align-items: center; justify-content: center;
    font-family: var(--pixel); font-size: 6px; line-height: 1.2; color: #241a3a; text-align: center;
  }
  .card .meta { font-size: 16px; line-height: 1; color: var(--muted); text-align: center; }
  .card .meta b { font-weight: 400; color: var(--rc); }
  .card.found.rare .frame { animation: shine 1.4s ease-in-out infinite alternate; }
  @keyframes shine { from { filter: drop-shadow(0 0 2px rgba(255,207,51,0.4)); } to { filter: drop-shadow(0 0 10px rgba(255,207,51,0.95)); } }
  .count {
    position: absolute; right: 14%; top: 13%;
    background: rgba(0, 0, 0, 0.75); color: #fff;
    font-family: var(--pixel); font-size: 7px; line-height: 1; padding: 3px 4px; border-radius: 3px;
  }

  /* ---------- Effects + game over ---------- */
  #fx { position: fixed; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 20; }
  #over {
    position: fixed; inset: 0; z-index: 30;
    background: rgba(8, 4, 20, 0.84);
    display: grid; place-items: center; padding: 16px;
  }
  #over[hidden] { display: none; }
  .overcard {
    max-width: 440px; width: 100%;
    background: var(--plum);
    border: 4px solid var(--fail);
    box-shadow: inset 0 0 0 3px #000, 0 0 40px rgba(255, 36, 36, 0.4);
    border-radius: 12px;
    padding: 20px 18px;
    text-align: center;
    display: flex; flex-direction: column; align-items: center; gap: 12px;
  }
  .overcard img { width: 80%; height: auto; }
  .overcard p { margin: 0; font-size: 22px; line-height: 1.15; color: var(--muted); }
  .overcard p b { color: var(--cream); font-weight: 400; }
  #again {
    font-family: var(--pixel); font-size: 12px; line-height: 1.4;
    color: #241a00; background: var(--gold);
    border: 3px solid #000; box-shadow: inset 0 -4px 0 #b88900;
    border-radius: 8px; padding: 12px 14px; cursor: pointer;
  }
  #again:active { box-shadow: inset 0 2px 0 #b88900; transform: translateY(2px); }

  /* ---------- Narrow screens: machine first, panels underneath ---------- */
  @media (max-width: 1000px) {
    .table { grid-template-columns: minmax(0, 1fr); justify-items: center; gap: 14px; }
    .side.left, .side.right { align-items: center; width: 100%; }
    .machine { order: -1; width: min(100%, 480px); min-width: 0; }
    .panel { max-width: 560px; }
    .plaques { grid-template-columns: repeat(4, minmax(0, 1fr)); }
    .cards { grid-template-columns: repeat(5, minmax(0, 1fr)); }
    .title { width: min(78vw, 380px); }
    .audio { position: absolute; }
  }
  @media (max-width: 520px) {
    .plaques { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    .cards { grid-template-columns: repeat(3, minmax(0, 1fr)); }
    .sbtn { width: 44px; }
    .title { width: min(64vw, 300px); }
  }
  @media (prefers-reduced-motion: reduce) {
    .ball, #winImg, #fail, #winText, #prompt, #lever.pull, #money.bump, .card.found.rare .frame { animation: none !important; }
  }
</style>
</head>
<body>
<div class="audio">
  <button class="sbtn" id="musicBtn" type="button" aria-pressed="true" aria-label="Music">
    <img class="up" src="assets/btn-music.webp" alt=""><img class="down" src="assets/btn-music-down.webp" alt=""><img class="off" src="assets/btn-music-off.webp" alt="">
  </button>
  <button class="sbtn" id="sfxBtn" type="button" aria-pressed="true" aria-label="Sound effects">
    <img class="up" src="assets/btn-sound.webp" alt=""><img class="down" src="assets/btn-sound-down.webp" alt=""><img class="off" src="assets/btn-sound-off.webp" alt="">
  </button>
</div>

<div class="wrap">
  <header><h1><img class="title" src="assets/title.webp" alt="Lottery Simulator" width="1200" height="397"></h1></header>

  <div class="table">
    <aside class="side left">
      <section class="panel" aria-label="Stats">
        <h2>STATS</h2>
        <div class="plaques">
          <div class="plaque"><span>TICKETS</span><b id="sTickets">0</b></div>
          <div class="plaque"><span>MONKEYS</span><b id="sWins">0</b></div>
          <div class="plaque"><span>STREAK</span><b id="sStreak">0</b></div>
          <div class="plaque"><span>LONGEST</span><b id="sLongest">0</b></div>
        </div>
        <div class="plate" id="luck"></div>
      </section>
    </aside>

    <div class="machine" id="machine" role="button" tabindex="0" aria-label="Slot machine: tap or pull the lever to buy a $1 ticket">
      <div id="screen" aria-live="polite">
        <div id="prompt">PULL THE LEVER<small>OR TAP ANYWHERE · $1</small></div>
        <div id="drawing" hidden><div class="ball" id="ball">0</div><div class="drawlabel">DRAWING…</div></div>
        <img id="fail" src="assets/txt-fail.webp" alt="FAIL" hidden>
        <div id="win" hidden>
          <img id="winImg" alt="">
          <div class="wininfo">
            <img id="winText" alt="">
            <span class="badge" id="winBadge">COMMON</span>
            <div id="winName"></div>
          </div>
        </div>
      </div>
      <img class="mbody" src="assets/machine.webp" alt="" width="1086" height="1448">
      <div class="marquee"><b id="mqOdds">1 IN 20</b><span id="mqPrize">PRIZE $12</span></div>
      <div id="money">$20</div>
      <div class="slot-hint">$1</div>
      <button class="dbtn" type="button" data-mode="easy" aria-label="Easy, 1 in 5"><img class="up" src="assets/btn-easy.webp" alt=""><img class="on" src="assets/btn-easy-on.webp" alt=""></button>
      <button class="dbtn" type="button" data-mode="normal" aria-label="Normal, 1 in 20"><img class="up" src="assets/btn-normal.webp" alt=""><img class="on" src="assets/btn-normal-on.webp" alt=""></button>
      <button class="dbtn" type="button" data-mode="hard" aria-label="Hard, 1 in 1,000"><img class="up" src="assets/btn-hard.webp" alt=""><img class="on" src="assets/btn-hard-on.webp" alt=""></button>
      <button class="dbtn" type="button" data-mode="real" aria-label="Real Lottery, 1 in 292,201,338"><img class="up" src="assets/btn-real.webp" alt=""><img class="on" src="assets/btn-real-on.webp" alt=""></button>
      <img id="lever" src="assets/lever.webp" alt="" width="110" height="324">
      <div id="payout"></div>
    </div>

    <aside class="side right">
      <section class="panel" aria-label="Monkey collection">
        <h2>COLLECTION <span id="collCount">0 of 5 found</span></h2>
        <div class="cards" id="cards"></div>
      </section>
    </aside>
  </div>
</div>

<canvas id="fx"></canvas>

<div id="over" hidden>
  <div class="overcard" role="dialog" aria-modal="true" aria-label="Out of money">
    <img src="assets/txt-broke.webp" alt="BROKE!">
    <p id="overText"></p>
    <p>Real lotteries work the same way: they pay out less than they take in, so the longer you play, the more you lose.</p>
    <button id="again" type="button">PLAY AGAIN · $20</button>
  </div>
</div>

<script>
(() => {
  // ---------- Game data ----------
  const START_MONEY = 20;
  const TICKET = 1;
  const MODES = {
    easy:   { label: 'Easy',         odds: 5,         prize: 3 },
    normal: { label: 'Normal',       odds: 20,        prize: 12 },
    hard:   { label: 'Hard',         odds: 1000,      prize: 500 },
    real:   { label: 'Real Lottery', odds: 292201338, prize: 100000000 },
  };
  const RARITY = {
    common:   { label: 'Common',   mult: 1, color: 'var(--common)',   frame: 'assets/card-common.webp',   win: [12.6, 11.4, 74.8, 57.9],  name: [75.5, 11] },
    uncommon: { label: 'Uncommon', mult: 2, color: 'var(--uncommon)', frame: 'assets/card-uncommon.webp', win: [12.65, 11.5, 74.5, 57.8], name: [75.5, 11] },
    rare:     { label: 'Rare',     mult: 5, color: 'var(--rare)',     frame: 'assets/card-rare.webp',     win: [12.7, 15.65, 73.6, 54.7], name: [77, 10.5] },
  };
  const LOCKED_FRAME = 'assets/card-locked.webp';
  const TXT = { jackpot: 'assets/txt-jackpot.webp', rare: 'assets/txt-rare.webp' };
  // When you win, which monkey you get is picked by weight (weights add up to 100).
  const MONKEYS = [
    { id: 'finger',   name: 'Finger Hugger',   rarity: 'common',   weight: 34, src: 'assets/monkey-finger.webp' },
    { id: 'pocket',   name: 'Pocket Marmoset', rarity: 'common',   weight: 34, src: 'assets/monkey-pocket.webp' },
    { id: 'bignose',  name: 'Big Nose',        rarity: 'uncommon', weight: 14, src: 'assets/monkey-bignose.webp' },
    { id: 'wildhair', name: 'Wild Hair',       rarity: 'uncommon', weight: 13, src: 'assets/monkey-wildhair.webp' },
    { id: 'selfie',   name: 'Selfie Grin',     rarity: 'rare',     weight: 5,  src: 'assets/monkey-selfie.webp' },
  ];
  const TOTAL_WEIGHT = MONKEYS.reduce((s, m) => s + m.weight, 0);

  // ---------- Random numbers ----------
  // Unbiased random integer in [0, n) from the browser's crypto RNG (rejection sampling).
  const buf = new Uint32Array(1);
  function randInt(n) {
    const limit = Math.floor(2 ** 32 / n) * n;
    let x;
    do { crypto.getRandomValues(buf); x = buf[0]; } while (x >= limit);
    return x % n;
  }
  function pickMonkey() {
    let r = randInt(TOTAL_WEIGHT);
    for (const m of MONKEYS) { if (r < m.weight) return m; r -= m.weight; }
    return MONKEYS[0];
  }

  // ---------- Saved settings (per browser, optional) ----------
  const store = {
    get(k, d) { try { const v = localStorage.getItem(k); return v == null ? d : JSON.parse(v); } catch { return d; } },
    set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} },
  };

  // ---------- State ----------
  let mode = store.get('lotto.mode', 'normal');
  if (!MODES[mode]) mode = 'normal';
  let musicOn = store.get('lotto.music', true);
  let sfxOn = store.get('lotto.sfx', true);
  const collection = store.get('lotto.collection', {});
  let money, tickets, wins, streak, longest, sinceWin, lastWinTook;
  let busy = false;
  function resetRun() {
    money = START_MONEY; tickets = 0; wins = 0; streak = 0; longest = 0; sinceWin = 0; lastWinTook = null;
  }
  resetRun();

  // ---------- DOM ----------
  const $ = (id) => document.getElementById(id);
  const fmt = (n) => Math.round(n).toLocaleString('en-US');
  const money$ = (n) => '$' + fmt(n);
  const shortMoney = (n) => n >= 1e6 ? '$' + +(n / 1e6).toFixed(n >= 1e8 ? 0 : 1) + 'M' : money$(n);
  const dbtns = [...document.querySelectorAll('.dbtn')];

  function show(which) {
    for (const id of ['prompt', 'drawing', 'fail', 'win']) $(id).hidden = id !== which;
  }

  function renderOdds() {
    const m = MODES[mode];
    $('mqOdds').textContent = `1 IN ${fmt(m.odds)}`;
    $('mqOdds').style.fontSize = m.odds > 1e6 ? '2.4cqw' : '';
    $('mqPrize').textContent = `PRIZE ${shortMoney(m.prize)}+`;
    for (const b of dbtns) b.setAttribute('aria-pressed', String(b.dataset.mode === mode));
  }

  function renderStats() {
    $('money').textContent = shortMoney(money);
    $('sTickets').textContent = fmt(tickets);
    $('sWins').textContent = fmt(wins);
    $('sStreak').textContent = fmt(streak);
    $('sLongest').textContent = fmt(longest);
    const n = MODES[mode].odds;
    const luck = $('luck');
    luck.className = 'plate';
    if (lastWinTook == null) {
      luck.textContent = `Average: 1 monkey per ${fmt(n)} tickets`;
    } else if (lastWinTook < n) {
      luck.classList.add('lucky');
      luck.textContent = `Last win took ${fmt(lastWinTook)}. Lucky! (avg ${fmt(n)})`;
    } else if (lastWinTook > n) {
      luck.classList.add('unlucky');
      luck.textContent = `Last win took ${fmt(lastWinTook)}. Unlucky! (avg ${fmt(n)})`;
    } else {
      luck.textContent = `Last win took ${fmt(lastWinTook)}, right on average`;
    }
  }

  function renderCollection() {
    const n = MODES[mode].odds;
    const cards = $('cards');
    cards.innerHTML = '';
    let found = 0;
    for (const m of MONKEYS) {
      const count = collection[m.id] || 0;
      const r = RARITY[m.rarity];
      if (count) found++;
      const card = document.createElement('div');
      card.className = `card ${m.rarity}` + (count ? ' found' : '');
      card.style.setProperty('--rc', r.color);
      const [wl, wt, ww, wh] = r.win;
      card.innerHTML = count
        ? `<div class="frame">
             <img class="art" src="${m.src}" alt="${m.name}" style="left:${wl}%;top:${wt}%;width:${ww}%;height:${wh}%">
             <img class="border" src="${r.frame}" alt="">
             <div class="nm" style="top:${r.name[0]}%;height:${r.name[1]}%">${m.name.toUpperCase()}</div>
             <span class="count">×${fmt(count)}</span>
           </div>
           <div class="meta"><b>${r.label}</b><br>1 in ${fmt(n * TOTAL_WEIGHT / m.weight)}</div>`
        : `<div class="frame"><img class="border" src="${LOCKED_FRAME}" alt="Not found yet"></div>
           <div class="meta"><b>${r.label}</b><br>1 in ${fmt(n * TOTAL_WEIGHT / m.weight)}</div>`;
      cards.appendChild(card);
    }
    $('collCount').textContent = `${found} of ${MONKEYS.length} found`;
  }

  // Difficulty buttons on the machine
  for (const b of dbtns) {
    b.addEventListener('click', () => {
      if (busy) return;
      ensureAudio();
      sfxClick();
      mode = b.dataset.mode;
      store.set('lotto.mode', mode);
      renderOdds(); renderStats(); renderCollection();
    });
  }

  // ---------- Audio (all synthesized, no files) ----------
  let ac = null, master, musicGain, sfxGain, noiseBuf;
  function ensureAudio() {
    if (ac) { if (ac.state === 'suspended') ac.resume(); return; }
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return;
    ac = new AC();
    master = ac.createGain(); master.gain.value = 0.9; master.connect(ac.destination);
    musicGain = ac.createGain(); musicGain.gain.value = musicOn ? 0.5 : 0; musicGain.connect(master);
    sfxGain = ac.createGain(); sfxGain.gain.value = sfxOn ? 1 : 0; sfxGain.connect(master);
    noiseBuf = ac.createBuffer(1, Math.floor(ac.sampleRate * 0.2), ac.sampleRate);
    const d = noiseBuf.getChannelData(0);
    for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
    startMusic();
  }
  const NOTE = { C: 0, 'C#': 1, D: 2, 'D#': 3, E: 4, F: 5, 'F#': 6, G: 7, 'G#': 8, A: 9, 'A#': 10, B: 11 };
  function freq(name) {
    const m = /^([A-G]#?)(\d)$/.exec(name);
    const midi = 12 * (+m[2] + 1) + NOTE[m[1]];
    return 440 * 2 ** ((midi - 69) / 12);
  }
  function tone(dest, f, t, dur, { type = 'square', vol = 0.2, attack = 0.005, vibrato = 0, slideTo = 0 } = {}) {
    const o = ac.createOscillator();
    const g = ac.createGain();
    o.type = type;
    o.frequency.setValueAtTime(f, t);
    if (slideTo) o.frequency.exponentialRampToValueAtTime(slideTo, t + dur);
    if (vibrato) {
      const lfo = ac.createOscillator(), lg = ac.createGain();
      lfo.frequency.value = 6; lg.gain.value = vibrato;
      lfo.connect(lg); lg.connect(o.frequency);
      lfo.start(t); lfo.stop(t + dur + 0.05);
    }
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(vol, t + attack);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g); g.connect(dest);
    o.start(t); o.stop(t + dur + 0.05);
  }
  function noise(dest, t, dur, vol, hp) {
    const s = ac.createBufferSource(); s.buffer = noiseBuf;
    const f = ac.createBiquadFilter(); f.type = 'highpass'; f.frequency.value = hp;
    const g = ac.createGain();
    g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    s.connect(f); f.connect(g); g.connect(dest);
    s.start(t); s.stop(t + dur + 0.01);
  }

  // Sound effects
  function sfxClick() { if (ac) tone(sfxGain, 520, ac.currentTime, 0.05, { vol: 0.08 }); }
  function sfxTick() { if (ac) tone(sfxGain, 900 + Math.random() * 500, ac.currentTime, 0.04, { vol: 0.06 }); }
  function sfxLever() {
    if (!ac) return;
    const t = ac.currentTime;
    noise(sfxGain, t, 0.12, 0.12, 1500);                                  // ratchet
    tone(sfxGain, 300, t, 0.18, { type: 'square', vol: 0.08, slideTo: 90 }); // clunk
    tone(sfxGain, 180, t + 0.32, 0.12, { type: 'square', vol: 0.06, slideTo: 360 }); // spring back
  }
  function sfxFail() {
    if (!ac) return;
    const t = ac.currentTime;
    // Sad trombone: wah, wah, wah, waaaah
    const notes = ['G3', 'F#3', 'F3', 'E3'];
    notes.forEach((n, i) => {
      const last = i === notes.length - 1;
      tone(sfxGain, freq(n), t + i * 0.28, last ? 0.9 : 0.26, { type: 'sawtooth', vol: 0.12, attack: 0.03, vibrato: last ? 6 : 0 });
    });
  }
  function sfxWin(rarity) {
    if (!ac) return;
    const t = ac.currentTime;
    duckMusic(rarity === 'rare' ? 4.2 : 2.6);
    const run = ['C5', 'E5', 'G5', 'C6', 'G5', 'C6'];
    run.forEach((n, i) => tone(sfxGain, freq(n), t + i * 0.09, 0.14, { vol: 0.14 }));
    const chordAt = t + run.length * 0.09;
    ['C5', 'E5', 'G5', 'C6'].forEach(n => tone(sfxGain, freq(n), chordAt, 1.1, { type: 'triangle', vol: 0.16 }));
    // coins clinking into the tray
    for (let i = 0; i < 8; i++) tone(sfxGain, freq(i % 2 ? 'E6' : 'B5'), chordAt + 0.05 + i * 0.11, 0.09, { vol: 0.07 });
    if (rarity !== 'common') {
      ['D6', 'F6', 'A6', 'D7'].forEach((n, i) => tone(sfxGain, freq(n), chordAt + 0.5 + i * 0.07, 0.12, { type: 'triangle', vol: 0.09 }));
    }
    if (rarity === 'rare') {
      // Extra-long royal fanfare for the rare monkey
      const fan = [['G5', 0.18], ['G5', 0.18], ['G5', 0.18], ['C6', 0.5], ['A5', 0.18], ['B5', 0.18], ['C6', 0.9]];
      let at = chordAt + 1.0;
      for (const [n, d] of fan) {
        tone(sfxGain, freq(n), at, d * 0.95, { vol: 0.14 });
        tone(sfxGain, freq(n) / 2, at, d * 0.95, { type: 'triangle', vol: 0.1 });
        at += d;
      }
      ['C5', 'E5', 'G5', 'C6', 'E6'].forEach(n => tone(sfxGain, freq(n), at, 1.4, { type: 'triangle', vol: 0.1 }));
    }
  }

  // Background music: a bouncy casino-jungle loop, scheduled slightly ahead of time.
  const MELODY = [
    'E5','G5','A5','G5','E5','D5','C5','D5',
    'E5','G5','A5','C6','A5','G5','E5', null,
    'D5','E5','G5','E5','D5','C5','A4','C5',
    'D5','E5','D5','C5','A4', null,'C5', null,
  ];
  const BASS = ['C3', 'A2', 'F2', 'G2'];
  const STEP = 60 / 132 / 2; // eighth notes at 132 bpm
  let step = 0, nextAt = 0, musicTimer = null;
  function startMusic() {
    if (!ac || musicTimer) return;
    nextAt = ac.currentTime + 0.1;
    musicTimer = setInterval(() => {
      if (nextAt < ac.currentTime) nextAt = ac.currentTime + 0.05; // tab was in the background
      while (nextAt < ac.currentTime + 0.15) {
        const i = step % MELODY.length;
        const bar = Math.floor(i / 8);
        if (MELODY[i]) tone(musicGain, freq(MELODY[i]), nextAt, STEP * 0.9, { type: 'square', vol: 0.07 });
        if (i % 2 === 0) {
          const b = freq(BASS[bar]) * (i % 4 === 2 ? 2 : 1);
          tone(musicGain, b, nextAt, STEP * 1.6, { type: 'triangle', vol: 0.16 });
        } else {
          noise(musicGain, nextAt, 0.05, 0.035, 7000);
        }
        nextAt += STEP;
        step++;
      }
    }, 25);
  }
  function duckMusic(seconds) {
    if (!ac || !musicOn) return;
    const t = ac.currentTime;
    musicGain.gain.cancelScheduledValues(t);
    musicGain.gain.setValueAtTime(musicGain.gain.value, t);
    musicGain.gain.linearRampToValueAtTime(0.08, t + 0.1);
    musicGain.gain.setValueAtTime(0.08, t + seconds);
    musicGain.gain.linearRampToValueAtTime(0.5, t + seconds + 1);
  }

  function renderAudioButtons() {
    $('musicBtn').setAttribute('aria-pressed', String(musicOn));
    $('sfxBtn').setAttribute('aria-pressed', String(sfxOn));
  }
  $('musicBtn').addEventListener('click', () => {
    musicOn = !musicOn; store.set('lotto.music', musicOn); renderAudioButtons();
    ensureAudio();
    if (ac) {
      musicGain.gain.cancelScheduledValues(ac.currentTime);
      musicGain.gain.setTargetAtTime(musicOn ? 0.5 : 0, ac.currentTime, 0.05);
    }
  });
  $('sfxBtn').addEventListener('click', () => {
    sfxOn = !sfxOn; store.set('lotto.sfx', sfxOn); renderAudioButtons();
    ensureAudio();
    if (ac) sfxGain.gain.setTargetAtTime(sfxOn ? 1 : 0, ac.currentTime, 0.02);
  });

  // ---------- Confetti + bananas ----------
  const cv = $('fx'), cx = cv.getContext('2d');
  let parts = [], fxRunning = false;
  const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;
  function sizeCanvas() {
    const dpr = window.devicePixelRatio || 1;
    cv.width = innerWidth * dpr; cv.height = innerHeight * dpr;
    cx.setTransform(dpr, 0, 0, dpr, 0, 0);
    cx.imageSmoothingEnabled = false;
  }
  addEventListener('resize', sizeCanvas); sizeCanvas();
  function celebrate(rarity) {
    const count = reduceMotion ? 20 : rarity === 'rare' ? 160 : rarity === 'uncommon' ? 90 : 60;
    const colors = rarity === 'rare'
      ? ['#ffcf33', '#fff2a8', '#ffb000', '#ffffff']
      : ['#ffcf33', '#5dff6a', '#3fe0ff', '#ff4fa8', '#ffffff'];
    for (let i = 0; i < count; i++) {
      const banana = Math.random() < 0.35;
      parts.push({
        x: Math.random() * innerWidth,
        y: -20 - Math.random() * innerHeight * 0.6,
        vx: (Math.random() - 0.5) * 3,
        vy: 2 + Math.random() * 3,
        rot: Math.random() * Math.PI * 2,
        vr: (Math.random() - 0.5) * 0.25,
        size: banana ? 22 + Math.random() * 14 : 6 + Math.random() * 4,
        banana,
        color: colors[i % colors.length],
      });
    }
    if (!fxRunning) { fxRunning = true; requestAnimationFrame(fxLoop); }
  }
  function fxLoop() {
    cx.clearRect(0, 0, innerWidth, innerHeight);
    for (const p of parts) {
      p.vy += 0.06; p.x += p.vx; p.y += p.vy; p.rot += p.vr;
      cx.save(); cx.translate(Math.round(p.x), Math.round(p.y));
      if (p.banana) {
        cx.rotate(p.rot);
        cx.font = `${p.size}px "Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif`;
        cx.textAlign = 'center'; cx.textBaseline = 'middle';
        cx.fillText('🍌', 0, 0);
      } else {
        // chunky square pixel confetti that flips as it falls
        const w = Math.max(2, Math.round(p.size * Math.abs(Math.cos(p.rot))));
        cx.fillStyle = p.color;
        cx.fillRect(-w / 2, -p.size / 2, w, p.size);
      }
      cx.restore();
    }
    parts = parts.filter(p => p.y < innerHeight + 60);
    if (parts.length) requestAnimationFrame(fxLoop);
    else { fxRunning = false; cx.clearRect(0, 0, innerWidth, innerHeight); }
  }

  // ---------- Playing ----------
  function restartAnim(el, cls) {
    if (cls) { el.classList.remove(cls); void el.offsetWidth; el.classList.add(cls); return; }
    el.style.animation = 'none'; void el.offsetWidth; el.style.animation = '';
  }
  function setButtonsDisabled(v) { for (const b of dbtns) b.disabled = v; }

  function buyTicket() {
    if (busy || !$('over').hidden) return;
    ensureAudio();
    if (money < TICKET) { gameOver(); return; }
    busy = true;
    money -= TICKET; tickets++; sinceWin++;
    renderStats();
    setButtonsDisabled(true);
    $('screen').classList.remove('rare');
    restartAnim($('lever'), 'pull');
    if (sfxOn) sfxLever();

    const n = MODES[mode].odds;
    const digits = String(n - 1).length;
    const startDraw = () => {
      show('drawing');
      const spin = setInterval(() => {
        $('ball').textContent = String(randInt(n)).padStart(digits, '0');
        if (sfxOn) sfxTick();
      }, 75);
      setTimeout(() => {
        clearInterval(spin);
        const result = randInt(n); // you win only if this is exactly 0
        $('ball').textContent = String(result).padStart(digits, '0');
        finish(result === 0);
      }, reduceMotion ? 300 : 1000);
    };
    setTimeout(startDraw, reduceMotion ? 0 : 280);
  }

  function finish(won) {
    if (won) {
      const m = pickMonkey();
      const r = RARITY[m.rarity];
      const prize = MODES[mode].prize * r.mult;
      money += prize; wins++;
      lastWinTook = sinceWin; sinceWin = 0; streak = 0;
      collection[m.id] = (collection[m.id] || 0) + 1;
      store.set('lotto.collection', collection);

      $('win').style.setProperty('--rc', r.color);
      $('screen').classList.toggle('rare', m.rarity === 'rare');
      $('winBadge').textContent = r.label.toUpperCase();
      $('winName').textContent = m.name.toUpperCase();
      const txt = $('winText');
      txt.src = m.rarity === 'rare' ? TXT.rare : TXT.jackpot;
      txt.alt = m.rarity === 'rare' ? 'RARE MONKEY!' : 'JACKPOT!';
      const img = $('winImg');
      img.src = m.src; img.alt = m.name;
      restartAnim(img); restartAnim(txt);
      show('win');
      $('payout').textContent = `+${shortMoney(prize)}`;
      restartAnim($('payout'), 'show');
      sfxWin(m.rarity);
      celebrate(m.rarity);
      restartAnim($('money'), 'bump');
      renderCollection();
    } else {
      streak++; longest = Math.max(longest, streak);
      restartAnim($('fail'));
      show('fail');
      sfxFail();
    }
    renderStats();
    setButtonsDisabled(false);
    busy = false;
    if (money < TICKET) setTimeout(gameOver, 1300);
  }

  function gameOver() {
    $('overText').innerHTML =
      `You bought <b>${fmt(tickets)}</b> ticket${tickets === 1 ? '' : 's'} and won <b>${fmt(wins)}</b> monkey${wins === 1 ? '' : 's'}. ` +
      `Your longest losing streak was <b>${fmt(longest)}</b>.`;
    $('over').hidden = false;
    $('again').focus();
  }
  $('again').addEventListener('click', () => {
    resetRun();
    $('over').hidden = true;
    show('prompt');
    renderStats();
    $('machine').focus();
  });

  // Tap anywhere (except the buttons and side panels) to play.
  document.addEventListener('click', (e) => {
    if (e.target.closest('button, .panel, #over')) return;
    buyTicket();
  });
  document.addEventListener('keydown', (e) => {
    if ((e.key === ' ' || e.key === 'Enter') && !e.target.closest('button')) {
      e.preventDefault();
      buyTicket();
    }
  });

  renderAudioButtons();
  renderOdds();
  renderStats();
  renderCollection();
})();
</script>
</body>
</html>
